esphome:
  name: esphome-buva-fan
  friendly_name: Buva ventilatie

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: VERY_VERBOSE

# Enable Home Assistant API
api:
  encryption:
    key: "redacted"

ota:
  - platform: esphome
    password: "redacted"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# SPI configuration for nRF905
spi:
  id: spi_bus
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  interface: hardware

# External components
external_components:
  - source:
      type: git
      # url: https://github.com/srslynow/esphome-zehnder
      url: https://github.com/spudje/esphome-buva
      ref: main
    refresh: 60sec
    components: [zehnder_fan]

# Fan configuration
fan:
  - platform: zehnder_fan
    id: ventilation_fan
    name: "Mechanical Ventilation"
    spi_id: spi_bus
    
    # Required Pin Configuration
    # cs_pin: GPIO18
    # pwr_pin: GPIO15
    # ce_pin: GPIO5
    # txen_pin: GPIO7
    # dr_pin: GPIO23

    cs_pin: GPIO5
    pwr_pin: GPIO22
    ce_pin: GPIO26
    txen_pin: GPIO25
    dr_pin: GPIO14    

    # cd_pin: GPIO33
    # am_pin: GPIO32
    

button:
  - platform: restart
    name: "Restart Controller"
  - platform: template
    name: "Pair with Fan"
    icon: "mdi:wifi"
    entity_category: config
    on_press:
      - lambda: |-
          id(ventilation_fan).start_pairing();
